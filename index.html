<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OIL 신청</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1f2430; --sub:#6b7280; --line:#e5e7eb; --brand:#ee4d2d; --ok:#16a34a; --err:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --card:#1e2127; --text:#eef0f3; --sub:#9aa3b0; --line:#2e333b; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif; }
  .wrap { max-width:560px; margin:0 auto; display:grid; gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  h1 { font-size:18px; margin:0 0 4px; } .sub { color:var(--sub); font-size:13px; }
  .bal { display:flex; gap:12px; margin-top:12px; }
  .bal div { flex:1; background:var(--bg); border-radius:10px; padding:10px 12px; }
  .bal b { display:block; font-size:22px; } .bal span { font-size:12px; color:var(--sub); }
  label { display:block; font-size:13px; color:var(--sub); margin:12px 0 4px; }
  input { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); font-size:15px; }
  .preview { margin-top:12px; padding:10px 12px; border-radius:8px; background:var(--bg); font-size:14px; min-height:42px; }
  .preview.bad { color:var(--err); }
  button { width:100%; margin-top:14px; padding:12px; border:0; border-radius:10px; background:var(--brand); color:#fff; font-size:16px; font-weight:600; }
  button:disabled { opacity:.45; }
  .msg { margin-top:12px; padding:10px 12px; border-radius:8px; font-size:14px; display:none; }
  .msg.ok { display:block; background:rgba(22,163,74,.12); color:var(--ok); }
  .msg.err { display:block; background:rgba(220,38,38,.12); color:var(--err); }
  .notice { font-size:12px; color:var(--sub); margin-top:10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; } td { padding:6px 0; border-top:1px solid var(--line); } td:last-child { text-align:right; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>OIL 신청</h1>
    <div class="sub" id="who">SeaTalk 계정 확인 중…</div>
    <div class="bal">
      <div><b id="remain">-</b><span>잔여 OIL (시간)</span></div>
      <div><b id="applied">-</b><span>사용 OIL (시간)</span></div>
    </div>
  </div>

  <div class="card">
    <label for="date">날짜</label>
    <input type="date" id="date">
    <label for="start">시작 시간 (07:30 ~ 20:30)</label>
    <input type="time" id="start" step="1800" value="09:00">
    <label for="end">종료 시간 (07:30 ~ 20:30)</label>
    <input type="time" id="end" step="1800" value="18:00">
    <div class="preview" id="preview">-</div>
    <button id="submit" disabled>신청하기</button>
    <div class="msg" id="msg"></div>
    <div class="notice">OIL은 사전 신청이 원칙입니다. 하루 최대 8시간, 4시간 초과 시 12:00~13:00 겹치면 1시간이 차감됩니다. 잘못 신청한 경우 이메일로 수정/삭제를 요청해 주세요.</div>
  </div>

  <div class="card">
    <div class="sub" style="margin-bottom:6px">최근 신청 내역</div>
    <table id="hist"><tbody><tr><td class="sub">-</td></tr></tbody></table>
  </div>
</div>

<script>
  // ★ 배포 후 Apps Script 웹앱 URL(…/exec)로 교체
  const API_URL = 'https://script.google.com/macros/s/AKfycbzw97lKjf7MGXcOWGCldp3h03X4iZqrjBVUiYui88aQSJfdT7Dkj3JU6FT0Howzh7P_ig/exec';
</script>
<script type="module">
  import { getSSOToken } from 'https://esm.sh/@seatalk/web-app-sdk@1.5.0';

  const $ = id => document.getElementById(id);
  let sso = null, busy = false, status = null;

  // 서버 규칙(Code.gs)과 동일한 계산 - 미리보기용 (최종 판단은 서버)
  function calc(date, s, e) {
    if (!date || !s || !e) return { err: '날짜와 시간을 입력하세요.' };
    const toMin = t => +t.slice(0, 2) * 60 + +t.slice(3, 5);
    const a = toMin(s), b = toMin(e), MIN = 450, MAX = 1230;
    if (a < MIN || a > MAX || b < MIN || b > MAX) return { err: '07:30 ~ 20:30 사이로 입력하세요.' };
    let h = (b - a) / 60;
    if (h <= 0) return { err: '종료 시간이 시작 시간보다 늦어야 합니다.' };
    if (h > 4 && a < 13 * 60 && b > 12 * 60) h -= 1;
    h = Math.round(h * 100) / 100;
    let note = '';
    if (h > 8) { h = 8; note = ' (하루 최대 8시간 적용)'; }
    if (h <= 0) return { err: '시간을 확인하세요.' };
    return { h, note };
  }

  function refresh() {
    const r = calc($('date').value, $('start').value, $('end').value);
    const p = $('preview');
    if (r.err) { p.textContent = r.err; p.className = 'preview bad'; $('submit').disabled = true; return; }
    const after = status ? Math.round((status.remainingOT - r.h) * 100) / 100 : null;
    p.className = 'preview';
    p.textContent = `사용 시간 ${r.h}시간${r.note}` + (after !== null ? ` → 신청 후 잔여 ${after}시간` : '');
    $('submit').disabled = busy || !status || after < 0;
    if (after !== null && after < 0) { p.textContent += ' · 잔여 OIL 부족'; p.className = 'preview bad'; }
  }

  async function api(body) {
    // text/plain → CORS preflight 없이 호출
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, ssoToken: sso }) });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || '요청 실패');
    return j.data;
  }

  function render(d) {
    status = d;
    $('who').textContent = d.email;
    $('remain').textContent = d.remainingOT;
    $('applied').textContent = d.appliedOT;
    $('hist').innerHTML = d.history.length
      ? d.history.map(x => `<tr><td>${x.start} ~ ${x.end.slice(11)}</td><td>${x.hours}h</td></tr>`).join('')
      : '<tr><td class="sub">신청 내역이 없습니다.</td></tr>';
    refresh();
  }

  function show(kind, text) { const m = $('msg'); m.className = 'msg ' + kind; m.textContent = text; }

  async function load() {
    try {
      sso = await getSSOToken();                 // SeaTalk 안에서만 동작
      render(await api({ action: 'status' }));
    } catch (e) {
      $('who').textContent = '불러오지 못했습니다';
      show('err', (e && e.message) || 'SeaTalk 앱 안에서 열어 주세요.');
    }
  }

  async function submit() {
    const r = calc($('date').value, $('start').value, $('end').value);
    if (r.err) return;
    const d = $('date').value;
    const post = new Date(`${d}T${$('start').value}`) < new Date();
    const warn = post ? '\n\n※ 이미 지난 시간입니다. 사후 신청은 지양해 주세요.' : '';
    if (!confirm(`${d} ${$('start').value}~${$('end').value}\n사용 시간 ${r.h}시간을 신청할까요?${warn}`)) return;
    busy = true; $('submit').disabled = true; show('', '');
    try {
      sso = await getSSOToken();                 // 토큰은 일회성/단기 → 매번 새로 발급
      const out = await api({ action: 'submit', start: `${d}T${$('start').value}`, end: `${d}T${$('end').value}` });
      show('ok', `신청이 완료되었습니다. 사용 ${out.usage}시간 · 잔여 ${out.remaining}시간. 확인 메일이 발송됩니다.`);
      render(await api({ action: 'status' }));
    } catch (e) { show('err', e.message); }
    busy = false; refresh();
  }

  const t = new Date(); t.setMinutes(t.getMinutes() - t.getTimezoneOffset());
  $('date').value = t.toISOString().slice(0, 10);
  ['date', 'start', 'end'].forEach(id => $(id).addEventListener('input', refresh));
  $('submit').addEventListener('click', submit);
  refresh(); load();
</script>
</body>
</html>
